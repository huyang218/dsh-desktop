<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title></title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: #101014; color: #d5d5dc;
    font: 15px/1.6 -apple-system, "PingFang SC", "Segoe UI", sans-serif;
  }
  .spinner {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid #2c2c34; border-top-color: #4c8dff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { color: #7a7a86; font-size: 13px; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <div id="starting"></div>
  <div class="hint" id="hint"></div>
<script>
  // This page loads before any IPC channel exists — it is what the window
  // shows while the main process is still setting one up — so the language
  // arrives in the query string that loadFile() attaches.
  const STRINGS = {
    'zh-CN': {
      starting: '正在启动 {app}…',
      hint: '首次启动会下载并安装 dsh 运行时,可能需要几分钟',
    },
    en: {
      starting: 'Starting {app}…',
      hint: 'The first launch downloads and installs the dsh runtime, which can take a few minutes',
    },
  }
  const query = new URLSearchParams(location.search)
  const lang = query.get('lang')
  // The brand travels the same way and for the same reason: this page paints
  // before there is any channel to ask over.
  const app = query.get('app') || 'DeepSeek Harness'
  const strings = STRINGS[lang] ?? STRINGS.en
  document.documentElement.lang = STRINGS[lang] ? lang : 'en'
  document.title = app
  document.getElementById('starting').textContent = strings.starting.replace('{app}', app)
  document.getElementById('hint').textContent = strings.hint
</script>
</body>
</html>
