<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title></title>
<style>
  /* Tokens first, so the two colour schemes differ only in values. The dsh
     web UI follows the system, and a plugin window nailed to dark would look
     like a different application docked inside this one. */
  :root {
    color-scheme: light dark;
    --bg: #f6f6f8;
    --surface: #ffffff;
    --surface-2: #f0f0f3;
    --sunken: #fafafb;
    --border: #e0e0e6;
    --border-strong: #cfcfd8;
    --text: #1c1c22;
    --text-muted: #6b6b78;
    --text-faint: #90909c;
    --accent: #3b62d9;
    --accent-text: #ffffff;
    --accent-soft: #eaf0ff;
    --ok-bg: #e6f6ec; --ok-text: #1c7a45;
    --idle-bg: #f3eee4; --idle-text: #8a6a2f;
    --warn-bg: #fdf6e3; --warn-border: #ecdcb0; --warn-text: #7a5c17;
    --danger: #c0392b;
    --shadow: 0 1px 2px rgba(20, 20, 32, 0.06), 0 8px 24px rgba(20, 20, 32, 0.08);
    --radius: 9px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131317;
      --surface: #1b1b21;
      --surface-2: #24242b;
      --sunken: #101014;
      --border: #2a2a33;
      --border-strong: #3a3a45;
      --text: #e9e9ef;
      --text-muted: #9a9aa6;
      --text-faint: #6f6f7b;
      --accent: #5b7cf0;
      --accent-text: #ffffff;
      --accent-soft: #222a44;
      --ok-bg: #16301f; --ok-text: #74cf95;
      --idle-bg: #2e2519; --idle-text: #d3a76c;
      --warn-bg: #2b2418; --warn-border: #4d3d1e; --warn-text: #e6c987;
      --danger: #e06a5c;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.45);
    }
  }

  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; gap: 14px;
    box-sizing: border-box; padding: 18px 20px;
    background: var(--bg); color: var(--text);
    font: 13px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: var(--accent-text); }

  /* Header */
  header { display: flex; align-items: baseline; gap: 9px; }
  h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .chip {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border);
  }
  .hint { color: var(--text-muted); font-size: 12px; }

  /* Install row */
  .row { display: flex; gap: 8px; }
  input, button, select, textarea { font: inherit; }
  input {
    flex: 1; padding: 9px 11px; border-radius: var(--radius);
    border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text); outline: none; transition: border-color .12s, box-shadow .12s;
  }
  input::placeholder { color: var(--text-faint); }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  button {
    appearance: none; cursor: pointer; white-space: nowrap;
    padding: 9px 15px; border-radius: var(--radius);
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
    transition: background .12s, border-color .12s, color .12s, transform .06s;
  }
  button:hover:not(:disabled) { background: var(--surface-2); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 550; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  button.small { padding: 6px 11px; font-size: 12px; }
  button.danger:hover:not(:disabled) { color: var(--danger); border-color: var(--danger); background: var(--surface); }

  /* One panel per window — the manager's list, or the market's — owning the
     space between the header and the log and scrolling inside it, so the log
     stays put while a list of hundreds is scrolled. */
  .panel { display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0; }
  .panel[hidden] { display: none; }

  /* Restart notice */
  #restart-bar {
    display: none; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--warn-bg); border: 1px solid var(--warn-border);
    border-radius: var(--radius); color: var(--warn-text);
  }

  /* Plugin list: name and status on one line, the spec beneath it, actions
     pinned right across both — a spec can be a long path and should never
     push the buttons around. */
  #list { display: flex; flex-direction: column; gap: 7px; overflow-y: auto; }
  .plugin {
    display: grid; align-items: center; gap: 2px 9px;
    grid-template-columns: max-content max-content 1fr max-content;
    padding: 10px 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    transition: border-color .12s, background .12s;
  }
  .plugin:hover { border-color: var(--border-strong); }
  .plugin .name { grid-area: 1 / 1; font-weight: 600; }
  .plugin .badge { grid-area: 1 / 2; }
  .plugin .meta {
    grid-area: 2 / 1 / auto / 4; color: var(--text-muted); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  /* The actions share one cell rather than a column each: a row without an
     update button would otherwise leave an empty column and stop lining up
     with the rows that have one. */
  .plugin .actions { grid-area: 1 / 4 / span 2; display: flex; gap: 8px; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--ok-bg); color: var(--ok-text); white-space: nowrap;
  }
  .badge.off { background: var(--idle-bg); color: var(--idle-text); }
  .empty { color: var(--text-faint); padding: 28px; text-align: center; }

  /* Market entries: the same row shape as an installed plugin, with the
     description and provenance beneath and the action pinned right. */
  #market-list { display: flex; flex-direction: column; gap: 7px; overflow-y: auto; }
  .entry {
    display: grid; align-items: center; gap: 3px 9px;
    grid-template-columns: max-content max-content 1fr max-content;
    padding: 10px 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    transition: border-color .12s;
  }
  .entry:hover { border-color: var(--border-strong); }
  .entry .name { grid-area: 1 / 1; font-weight: 600; }
  .entry .stars { grid-area: 1 / 2; font-size: 12px; color: var(--text-faint); white-space: nowrap; }
  .entry .badges { grid-area: 1 / 3; display: flex; gap: 5px; flex-wrap: wrap; }
  .entry .action { grid-area: 1 / 4 / span 3; justify-self: end; }
  .entry .desc {
    grid-area: 2 / 1 / auto / 4; font-size: 12px; color: var(--text-muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .entry .meta {
    grid-area: 3 / 1 / auto / 4; font-size: 11px; color: var(--text-faint);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .badge.warn { background: var(--warn-bg); color: var(--warn-text); }
  .badge.kind { background: var(--accent-soft); color: var(--accent); }
  /* Links open in the user's browser, so they are buttons, not anchors. */
  .link {
    padding: 0; border: none; background: none; color: var(--accent);
    font-size: 11px; text-decoration: underline; text-underline-offset: 2px;
  }
  .link:hover:not(:disabled) { background: none; filter: brightness(1.15); }

  /* Log */
  #log {
    margin: 0; padding: 10px 12px; height: 130px; overflow-y: auto; white-space: pre-wrap;
    background: var(--sunken); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text-muted); font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  /* Config modal */
  #modal-mask {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: rgba(12, 12, 20, .45); backdrop-filter: blur(2px);
    align-items: center; justify-content: center;
  }
  #modal {
    width: 520px; max-width: calc(100vw - 40px); max-height: 80vh; overflow-y: auto;
    box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow);
  }
  #modal h2 { margin: 0; font-size: 14px; font-weight: 650; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; font-weight: 550; color: var(--text); }
  .field label .req { color: var(--danger); }
  .field .desc { font-size: 11px; color: var(--text-muted); line-height: 1.5; }
  .field input[type="text"], .field input[type="password"], .field input[type="number"],
  .field select, .field textarea {
    padding: 8px 10px; border-radius: 7px; border: 1px solid var(--border-strong);
    background: var(--surface); color: var(--text); outline: none;
    transition: border-color .12s, box-shadow .12s;
  }
  .field textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; min-height: 62px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .field input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 2px; }

  /* Scrollbars: the default light ones are invisible on the sunken panels. */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: var(--border-strong); border-radius: 999px;
    border: 3px solid transparent; background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <header>
    <h1 id="heading"></h1>
    <span class="chip">web profile</span>
  </header>
  <div id="restart-bar">
    <span style="flex:1" data-i18n="plugins.restartNotice"></span>
    <button class="primary small" id="restart" data-i18n="button.restartService"></button>
  </div>
  <section class="panel" id="panel-installed">
    <div class="row">
      <input id="spec" data-i18n-placeholder="plugins.specPlaceholder" spellcheck="false">
      <button class="primary" id="install" data-i18n="plugins.install"></button>
      <button id="install-zip" data-i18n="plugins.installZip"></button>
    </div>
    <div class="hint" data-i18n="plugins.hint"></div>
    <div id="list"><div class="empty" data-i18n="plugins.loading"></div></div>
  </section>
  <section class="panel" id="panel-market" hidden>
    <div class="row">
      <input id="market-search" data-i18n-placeholder="market.searchPlaceholder" spellcheck="false">
      <button id="market-refresh" data-i18n="market.refresh"></button>
    </div>
    <div class="hint" id="market-meta"></div>
    <div id="market-list"></div>
  </section>
  <pre id="log"></pre>
  <div id="modal-mask">
    <div id="modal">
      <h2 id="modal-title"></h2>
      <div id="modal-fields"></div>
      <div class="modal-actions">
        <button id="modal-cancel" data-i18n="plugins.cancel"></button>
        <button class="primary" id="modal-save" data-i18n="plugins.save"></button>
      </div>
    </div>
  </div>
  <script>
    const $ = id => document.getElementById(id)
    let busy = false

    // Strings arrive from the main process at preload time, so the first
    // painted frame is already in the right language.
    const { locale, messages } = dshPlugins.i18n
    const t = (key, params) => {
      const template = messages[key] ?? key
      return params
        ? template.replace(/\{(\w+)\}/g, (whole, name) => (
          Object.hasOwn(params, name) ? String(params[name]) : whole))
        : template
    }
    document.documentElement.lang = locale
    for (const node of document.querySelectorAll('[data-i18n]')) {
      node.textContent = t(node.dataset.i18n)
    }
    for (const node of document.querySelectorAll('[data-i18n-placeholder]')) {
      node.placeholder = t(node.dataset.i18nPlaceholder)
    }

    function appendLog(line) {
      $('log').textContent += line + '\n'
      $('log').scrollTop = $('log').scrollHeight
    }
    dshPlugins.onLog(appendLog)

    // Renderer failures must never be silent: surface them in the log pane.
    window.addEventListener('error', event => appendLog(`✘ ${t('plugins.pageError', { message: event.message })}`))
    window.addEventListener('unhandledrejection', event => {
      appendLog(`✘ ${t('plugins.actionFailed', { message: event.reason?.message ?? event.reason })}`)
    })

    // The config IPC channels live in the Electron main process; running
    // against a shell that predates them means the app needs a real relaunch
    // (tray → Quit), not just a server restart.
    const configSupported = typeof dshPlugins.configSchema === 'function'
    // Same story for the zip channels: an app that predates them keeps the
    // spec field working rather than offering a button that cannot answer.
    const zipSupported = typeof dshPlugins.pickZip === 'function'
    if (!zipSupported) $('install-zip').style.display = 'none'
    const updateSupported = typeof dshPlugins.update === 'function'

    // Which of the two plugin windows this is. One page serves both: the log,
    // the restart notice, the busy state and the config form are the same in
    // either, and only the list above them differs.
    const isMarket = new URLSearchParams(location.search).get('mode') === 'market'
      && typeof dshPlugins.catalog === 'function'
    document.title = t(isMarket ? 'market.title' : 'plugins.title')
    $('heading').textContent = t(isMarket ? 'market.heading' : 'plugins.heading')
    $('panel-installed').hidden = isMarket
    $('panel-market').hidden = !isMarket

    function setBusy(value) {
      busy = value
      // Tabs and links stay live: switching view or opening a repository page
      // does not touch the profile, and freezing them makes a long install
      // feel like a hung window.
      for (const b of document.querySelectorAll('button:not(.tab):not(.link)')) b.disabled = value
    }

    /** The installed plugins, as of the last refresh; the market reads it too. */
    let installed = []

    async function refresh() {
      installed = await dshPlugins.list()
      const list = $('list')
      list.textContent = ''
      if (installed.length === 0) {
        list.innerHTML = `<div class="empty">${t('plugins.empty')}</div>`
      }
      for (const p of installed) {
        const row = document.createElement('div')
        row.className = 'plugin'
        const badge = p.active
          ? `<span class="badge">${t('plugins.badgeActive')}</span>`
          : `<span class="badge off">${t('plugins.badgeInactive')}</span>`
        // Only a registry dependency can be updated: a link:, file: or git
        // spec resolves to something the user, not npm, decides the version of.
        const updatable = updateSupported && !/^(?:link:|file:|github:|git\+|https?:|\.{0,2}\/)/.test(p.spec)
        row.innerHTML = `<span class="name"></span>${badge}<span class="meta"></span><span class="actions">`
          + (updatable ? `<button class="update small">${t('plugins.update')}</button>` : '')
          + `<button class="settings small">${t('plugins.settings')}</button>`
          + `<button class="danger small">${t('plugins.remove')}</button></span>`
        row.querySelector('.name').textContent = p.name
        row.querySelector('.meta').textContent = `${p.version ?? '?'} · ${p.spec}`
        row.querySelector('.update')?.addEventListener('click', () => run(() => dshPlugins.update(p.name), t('plugins.updating', { name: p.name })))
        row.querySelector('.settings').addEventListener('click', () => openConfig(p.name))
        row.querySelector('.danger').addEventListener('click', () => run(() => dshPlugins.remove(p.name), t('plugins.removing', { name: p.name })))
        list.appendChild(row)
      }
      // An install or removal changes what the market should offer.
      if (isMarket && market) renderMarket()
    }

    async function run(op, label) {
      if (busy) return
      setBusy(true)
      appendLog(`▶ ${label}`)
      try {
        await op()
        appendLog(`✔ ${t('plugins.done', { label })}`)
        $('restart-bar').style.display = 'flex'
      } catch (error) {
        appendLog(`✘ ${t('plugins.failed', { label, message: error.message })}`)
      } finally {
        setBusy(false)
        refresh()
      }
    }

    // ── Install-time config form: fields come from the plugin's exported
    // Schemastery Config schema (read by the shell's probe subprocess). ──

    const SECRET_KEY = /token|secret|password|apikey|api_key/i
    let modalState = null

    function fieldInput(field, current) {
      const value = current !== undefined ? current : field.default
      if (Array.isArray(field.options)) {
        const select = document.createElement('select')
        for (const option of field.options) {
          const el = document.createElement('option')
          el.value = String(option)
          el.textContent = String(option)
          if (String(option) === String(value)) el.selected = true
          select.appendChild(el)
        }
        return select
      }
      if (field.type === 'boolean') {
        const box = document.createElement('input')
        box.type = 'checkbox'
        box.checked = Boolean(value)
        return box
      }
      if (field.type === 'string' || field.type === 'number') {
        const input = document.createElement('input')
        input.type = field.type === 'number' ? 'number'
          : (field.role === 'secret' || SECRET_KEY.test(field.key)) ? 'password' : 'text'
        input.value = value === undefined || value === null ? '' : String(value)
        input.placeholder = field.default === undefined || field.default === '' ? '' : t('plugins.default', { value: field.default })
        input.spellcheck = false
        return input
      }
      // Arrays and nested objects fall back to a JSON textarea.
      const area = document.createElement('textarea')
      area.value = value === undefined ? '' : JSON.stringify(value, null, 2)
      area.placeholder = 'JSON'
      return area
    }

    function readField(field, input) {
      if (Array.isArray(field.options)) return input.value
      if (field.type === 'boolean') return input.checked
      const raw = input.value.trim()
      if (raw === '') return undefined
      if (field.type === 'number') {
        const parsed = Number(raw)
        return Number.isFinite(parsed) ? parsed : undefined
      }
      if (field.type === 'string') return raw
      try { return JSON.parse(raw) } catch { return undefined }
    }

    function showConfigModal(name, schema, current) {
      const fields = $('modal-fields')
      fields.textContent = ''
      modalState = { name, rowId: schema.rowId, entries: [] }
      $('modal-title').textContent = t('plugins.configTitle', { name })
      for (const field of schema.fields) {
        const wrap = document.createElement('div')
        wrap.className = 'field'
        const label = document.createElement('label')
        label.textContent = field.key
        if (field.required) label.innerHTML += ' <span class="req">*</span>'
        wrap.appendChild(label)
        const input = fieldInput(field, current[field.key])
        wrap.appendChild(input)
        if (field.description) {
          const desc = document.createElement('div')
          desc.className = 'desc'
          desc.textContent = field.description
          wrap.appendChild(desc)
        }
        fields.appendChild(wrap)
        modalState.entries.push({ field, input })
      }
      $('modal-mask').style.display = 'flex'
    }

    function closeModal() {
      $('modal-mask').style.display = 'none'
      modalState = null
    }

    async function openConfig(name) {
      if (busy) return
      if (!configSupported) {
        appendLog(`✘ ${t('plugins.noChannel')}`)
        return
      }
      try {
        const schema = await dshPlugins.configSchema(name)
        if (schema.error) { appendLog(`✘ ${t('plugins.readConfigFailed', { name, message: schema.error })}`); return }
        if (!schema.fields.length) { appendLog(`ℹ ${t('plugins.noFields', { name })}`); return }
        if (!schema.rowId) { appendLog(`ℹ ${t('plugins.noRow', { name })}`); return }
        const current = await dshPlugins.configGet(name)
        showConfigModal(name, schema, current)
      } catch (error) {
        appendLog(`✘ ${t('plugins.readConfigFailed', { name, message: error.message })}`)
      }
    }

    $('modal-cancel').addEventListener('click', closeModal)
    $('modal-save').addEventListener('click', async () => {
      if (!modalState) return
      // Only values differing from the schema default go into the patch
      // layer; everything else stays owned by the schema's own defaults.
      const values = {}
      for (const { field, input } of modalState.entries) {
        const value = readField(field, input)
        if (value === undefined) continue
        if (JSON.stringify(value) === JSON.stringify(field.default)) continue
        values[field.key] = value
      }
      const { name, rowId } = modalState
      closeModal()
      await run(() => dshPlugins.configSet(name, rowId, values), t('plugins.saveConfig', { name }))
    })

    /**
     * Runs an install and, if it brought in exactly one new package with
     * configuration, opens its form right away. Shared by both install
     * routes: a plugin from a zip is as configurable as one from npm.
     */
    async function install(op, label) {
      const before = new Set((await dshPlugins.list()).map(p => p.name))
      await run(op, label)
      if (!configSupported) return
      try {
        const added = (await dshPlugins.list()).filter(p => !before.has(p.name))
        if (added.length === 1) {
          const schema = await dshPlugins.configSchema(added[0].name)
          if (!schema.error && schema.fields.length && schema.rowId) {
            appendLog(`ℹ ${t('plugins.hasConfig', { name: added[0].name })}`)
            showConfigModal(added[0].name, schema, await dshPlugins.configGet(added[0].name))
          }
        }
      } catch (error) {
        appendLog(`✘ ${t('plugins.newConfigFailed', { message: error.message })}`)
      }
    }

    $('install').addEventListener('click', async () => {
      const spec = $('spec').value.trim()
      if (!spec) return
      await install(() => dshPlugins.install(spec), t('plugins.installing', { spec }))
    })
    $('install-zip').addEventListener('click', async () => {
      if (busy) return
      // The picker is opened by the main process, so the path never has to be
      // typed and the renderer only ever sees a file the user chose.
      const zipPath = await dshPlugins.pickZip()
      if (!zipPath) return
      const file = zipPath.split(/[\\/]/).pop()
      await install(() => dshPlugins.installZip(zipPath), t('plugins.installingZip', { file }))
    })
    $('spec').addEventListener('keydown', e => { if (e.key === 'Enter') $('install').click() })

    // ── Market: a curated catalog, read by the shell and installed through
    // the same `dsh plugin add` as everything else. ──

    /** Rows rendered at once; the rest waits behind a narrower search. */
    const MARKET_ROWS = 80
    let market = null

    /** The catalog carries both languages when it has them. */
    const localized = map => (locale.startsWith('zh') ? map.zh ?? map.en : map.en ?? map.zh) ?? ''

    const stars = value => (value < 1000
      ? String(value)
      : `${value < 100_000 ? (value / 1000).toFixed(1) : Math.round(value / 1000)}k`)

    async function loadMarket(force) {
      if (!market) $('market-list').innerHTML = `<div class="empty">${t('market.loading')}</div>`
      try {
        market = await dshPlugins.catalog(force)
        // A refresh that failed with a cache in hand still returns the cache.
        if (market.error) appendLog(`✘ ${t('market.refreshFailed', { message: market.error })}`)
      } catch (error) {
        $('market-list').innerHTML = ''
        $('market-meta').textContent = ''
        appendLog(`✘ ${t('market.loadFailed', { message: error.message })}`)
        return
      }
      renderMarket()
    }

    function renderMarket() {
      const query = $('market-search').value.trim().toLowerCase()
      const matches = market.entries.filter(entry => query === '' || [
        entry.name, entry.owner, entry.npm ?? '', localized(entry.description),
      ].join(' ').toLowerCase().includes(query))
      // Installable first, each group keeping the catalog's own order (stars
      // descending): what the user can act on with one click comes first.
      const ordered = [...matches].sort((a, b) => Number(b.installable) - Number(a.installable))
      const shown = ordered.slice(0, MARKET_ROWS)

      $('market-meta').textContent = t('market.meta', {
        source: market.source?.name ?? new URL(market.url).hostname,
        shown: shown.length,
        total: market.entries.length,
        time: new Date(market.fetchedAt).toLocaleString(locale),
      }) + (market.cached ? ` ${t('market.cached')}` : '')

      const list = $('market-list')
      list.textContent = ''
      if (shown.length === 0) {
        list.innerHTML = `<div class="empty">${t('market.empty')}</div>`
        return
      }
      const names = new Set(installed.map(p => p.name))
      for (const entry of shown) list.appendChild(marketRow(entry, names.has(entry.npm)))
      if (ordered.length > shown.length) {
        const more = document.createElement('div')
        more.className = 'empty'
        more.textContent = t('market.more', { shown: shown.length })
        list.appendChild(more)
      }
    }

    /**
     * One catalog entry. Everything here is remote text, so it is written
     * with textContent and never parsed as markup.
     */
    function marketRow(entry, isInstalled) {
      const row = document.createElement('div')
      row.className = 'entry'
      row.innerHTML = '<span class="name"></span><span class="stars"></span>'
        + '<span class="badges"></span><span class="action"></span>'
        + '<div class="desc"></div><div class="meta"></div>'
      row.querySelector('.name').textContent = entry.name
      row.querySelector('.stars').textContent = entry.stars ? `★ ${stars(entry.stars)}` : ''
      row.querySelector('.desc').textContent = localized(entry.description)

      const badges = row.querySelector('.badges')
      badges.appendChild(badge(entry.kind, 'kind'))
      // Install scripts run arbitrary code from the package at install time;
      // the catalog knows which packages have them, so say so before the click.
      if (entry.runsInstallScripts) badges.appendChild(badge(t('market.scripts'), 'warn', t('market.scriptsHint')))

      // The repository path, not owner + display name: catalog names carry
      // spaces and capitals that no repository has.
      const repo = new URL(entry.url).pathname.replace(/^\/|\/$/g, '')
      const meta = [repo, entry.npm, entry.license, entry.language]
      const metaLine = row.querySelector('.meta')
      metaLine.textContent = meta.filter(Boolean).join(' · ') + ' · '
      const link = document.createElement('button')
      link.className = 'link'
      link.textContent = t('market.repo')
      link.addEventListener('click', () => dshPlugins.openLink(entry.page ?? entry.url))
      metaLine.appendChild(link)

      const action = row.querySelector('.action')
      if (isInstalled) {
        action.appendChild(badge(t('market.installed')))
      } else if (entry.installable) {
        const button = document.createElement('button')
        button.className = 'primary small'
        button.textContent = t('market.install')
        button.disabled = busy
        button.addEventListener('click', () => install(
          () => dshPlugins.install(entry.npm), t('market.installing', { name: entry.npm }),
        ))
        action.appendChild(button)
      } else {
        action.appendChild(badge(t('market.manual'), 'off', t('market.manualHint')))
      }
      return row
    }

    function badge(text, variant = '', title = '') {
      const span = document.createElement('span')
      span.className = `badge ${variant}`.trim()
      span.textContent = text
      if (title) span.title = title
      return span
    }

    $('market-search').addEventListener('input', () => { if (market) renderMarket() })
    $('market-refresh').addEventListener('click', () => loadMarket(true))
    $('restart').addEventListener('click', async () => {
      setBusy(true)
      appendLog(`▶ ${t('plugins.restarting')}`)
      try {
        await dshPlugins.restart()
        appendLog(`✔ ${t('plugins.restarted')}`)
        $('restart-bar').style.display = 'none'
      } catch (error) {
        appendLog(`✘ ${t('plugins.restartFailed', { message: error.message })}`)
      } finally {
        setBusy(false)
      }
    })

    // The installed list is read in both windows: the market needs it to know
    // what is already installed, even though it never renders that list.
    refresh()
    if (isMarket) loadMarket(false)
  </script>
</body>
</html>
