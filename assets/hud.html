<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title></title>
<style>
  /* The window is transparent and frameless; this card is the whole of it,
     inset far enough that its shadow has somewhere to fall. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    display: flex; padding: 8px;
    font: 12px/1.35 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    /* The whole card drags: a badge with a title bar would be twice the size
       for the sake of somewhere to grab. */
    -webkit-app-region: drag;
    user-select: none; cursor: default;
  }
  .card {
    flex: 1; display: flex; flex-direction: column; gap: 7px;
    padding: 9px 11px; border-radius: 11px;
    background: rgba(22, 22, 28, 0.82);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.09);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    color: #e9e9ef;
  }
  header { display: flex; align-items: center; gap: 6px; }
  /* The header line carries the status. "dsh 资源" said nothing the window
     title was not already saying; what it is doing right now is the thing
     somebody keeps a badge on screen for. */
  .title { font-size: 11px; font-weight: 600; letter-spacing: .02em; color: #c8c8d2; }
  .dot.work { background: #ffb454; }
  .dot.stop { background: #e06a5c; }
  /* A state that is going somewhere pulses; a resting one does not, so the
     movement means something rather than being decoration. */
  .dot.work { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  /* A dot that says at a glance whether there is anything to measure. */
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #4ac07a; }
  .dot.down { background: #6f6f7b; }
  .spacer { flex: 1; }
  .close {
    -webkit-app-region: no-drag;
    appearance: none; border: none; background: none; cursor: pointer;
    padding: 0 2px; font-size: 13px; line-height: 1; color: #6f6f7b;
  }
  .close:hover { color: #e9e9ef; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .value {
    font: 600 15px/1.15 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .value .unit { font-size: 10px; font-weight: 500; color: #8a8a96; margin-left: 1px; }
  .label { font-size: 10px; color: #7a7a86; white-space: nowrap; }
  /* Busy is worth noticing without being alarming; the badge is a glance. */
  .value.busy { color: #ffb454; }

  /* The narrow layouts put the close button in the corner rather than in a
     row, so it costs no width, and show it only under the pointer: in a badge
     this small a permanent one would be a quarter of what is on screen. */
  .card.compact, .card.minimal { position: relative; flex-direction: row; align-items: center; gap: 9px; }
  .card.compact header, .card.minimal header { flex: none; }
  .card.compact .title, .card.minimal .title,
  .card.compact .spacer, .card.minimal .spacer { display: none; }
  .card.compact .close, .card.minimal .close {
    position: absolute; top: 3px; right: 5px;
    opacity: 0; transition: opacity .12s; font-size: 11px;
  }
  .card.compact:hover .close, .card.minimal:hover .close { opacity: 1; }
  .card.compact .label, .card.minimal .label { display: none; }

  /* ── Compact: one row, no labels. The unit carries the meaning — nobody
     reads "MB" and wonders which number it belongs to — so the labels go and
     the badge loses half its height. ── */
  .card.compact { padding: 8px 11px; }
  .card.compact .stats { flex: 1; grid-template-columns: none; grid-auto-flow: column; gap: 13px; align-items: center; }
  .card.compact .value { font-size: 14px; }

  /* ── Assistant: the status is the point and the numbers are the footnote,
     for somebody who keeps it on screen to know what the harness is doing
     rather than to watch a memory figure. ── */
  .card.assistant { gap: 5px; padding: 10px 12px; }
  .card.assistant .title { font-size: 13px; font-weight: 600; color: #e9e9ef; }
  .card.assistant .dot { width: 7px; height: 7px; }
  .card.assistant .stats { display: flex; align-items: baseline; gap: 0; grid-template-columns: none; }
  .card.assistant .stat { flex-direction: row; align-items: baseline; }
  /* The labels go: in a line this short the units already say which number is
     which, and four aligned columns would invite a comparison between figures
     that have nothing to do with each other. */
  .card.assistant .label { display: none; }
  .card.assistant .stat:not(:last-child)::after { content: '·'; color: #56565f; margin: 0 7px; }
  .card.assistant .value { font-size: 12px; font-weight: 500; color: #b8b8c4; }
  .card.assistant .value .unit { font-size: 10px; }

  /* ── The character layouts ───────────────────────────────────────────────
     Drawn here rather than shipped as images: they are a few hundred bytes of
     path data, they stay sharp on every display, and their expression is a
     class away — which is the point of having a face at all. It reads the
     state the badge already knows, so the character is showing something
     rather than decorating something. ── */
  .card.pup, .card.capybara, .card.anime {
    flex-direction: row; align-items: center; gap: 10px; padding: 9px 12px;
    position: relative;
  }
  .card.pup .close, .card.capybara .close, .card.anime .close {
    position: absolute; top: 3px; right: 5px; opacity: 0; transition: opacity .12s; font-size: 11px;
  }
  .card.pup:hover .close, .card.capybara:hover .close, .card.anime:hover .close { opacity: 1; }
  .char { display: none; flex: none; width: 40px; height: 40px; overflow: visible; }
  /* A supplied picture replaces the drawing entirely; it is given the same
     box and told to fit inside it, so a square or a tall one both land in the
     same place and the text beside them does not move. */
  .char.photo { object-fit: contain; }
  .card.pup .char.photo, .card.capybara .char.photo, .card.anime .char.photo { display: block; }
  .card.pup .char.photo ~ .char, .card.capybara .char.photo ~ .char, .card.anime .char.photo ~ .char { display: none; }
  .card.pup .char.pup, .card.capybara .char.capybara, .card.anime .char.anime { display: block; }
  /* Working gets a small bob — the badge is glanced at, and movement is the
     one thing a glance always catches. */
  .card.work .char { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-2px); } }
  .char .stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  /* One eye set per state, and only one drawn at a time. */
  .char .calm, .char .busy-face, .char .dead { display: none; }
  .card:not(.work):not(.stopped) .char .calm { display: block; }
  .card.work .char .busy-face { display: block; }
  .card.stopped .char .dead { display: block; }

  .card.pup .body, .card.capybara .body, .card.anime .body {
    display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1;
  }
  .card.pup header, .card.capybara header, .card.anime header { display: none; }
  .card.pup .say, .card.capybara .say, .card.anime .say {
    font-size: 12px; font-weight: 600; color: #e9e9ef;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card.pup .stats, .card.capybara .stats, .card.anime .stats {
    display: flex; align-items: baseline; gap: 0; grid-template-columns: none;
  }
  .card.pup .stat, .card.capybara .stat, .card.anime .stat { flex-direction: row; align-items: baseline; }
  .card.pup .label, .card.capybara .label, .card.anime .label { display: none; }
  .card.pup .stat:not(:last-child)::after,
  .card.capybara .stat:not(:last-child)::after,
  .card.anime .stat:not(:last-child)::after { content: '·'; color: #56565f; margin: 0 6px; }
  .card.pup .value, .card.capybara .value, .card.anime .value {
    font-size: 11px; font-weight: 500; color: #9a9aa6;
  }
  .card.pup .value .unit, .card.capybara .value .unit, .card.anime .value .unit { font-size: 9px; }

  /* ── Minimal: the one number worth a glance, and a dot for whether there is
     anything behind it. ── */
  .card.minimal { padding: 8px 12px; }
  .card.minimal .stats { grid-template-columns: none; }
  .card.minimal .stat:not(:first-child) { display: none; }
  .card.minimal .value { font-size: 20px; }

</style>
</head>
<body>
  <div class="card" id="card">
    <header>
      <span class="dot" id="dot"></span>
      <span class="title" id="title"></span>
      <span class="spacer"></span>
      <button class="close" id="close" title="">✕</button>
    </header>
    <img class="char photo" id="photo" alt="" hidden>
    <svg class="char pup" viewBox="0 0 40 40" aria-hidden="true">
      <g class="stroke" stroke="#e9e9ef" stroke-width="2">
        <path d="M8 14c-1-5 1-7 3-6l3 2"/>
        <path d="M32 14c1-5-1-7-3-6l-3 2"/>
        <path d="M20 7c7 0 12 5 12 12s-5 13-12 13S8 27 8 19 13 7 20 7z"/>
      </g>
      <g class="calm">
        <circle cx="15" cy="18" r="1.7" fill="#e9e9ef"/><circle cx="25" cy="18" r="1.7" fill="#e9e9ef"/>
        <path class="stroke" stroke="#e9e9ef" stroke-width="1.7" d="M17.5 24c1.5 1.6 3.5 1.6 5 0"/>
      </g>
      <g class="busy-face">
        <path class="stroke" stroke="#e9e9ef" stroke-width="1.8" d="M13 19c1.3-1.8 2.7-1.8 4 0M23 19c1.3-1.8 2.7-1.8 4 0"/>
        <path class="stroke" stroke="#e9e9ef" stroke-width="1.7" d="M17 24c1.6 1.8 3.8 1.8 5.4 0"/>
        <path class="stroke" stroke="#8fd0ff" stroke-width="1.6" d="M34 20c1.4 1.8 1.4 3.4 0 4-1.4-.6-1.4-2.2 0-4z"/>
      </g>
      <g class="dead">
        <path class="stroke" stroke="#e06a5c" stroke-width="1.8" d="M13.2 16.2l3.4 3.4M16.6 16.2l-3.4 3.4M23.4 16.2l3.4 3.4M26.8 16.2l-3.4 3.4"/>
        <path class="stroke" stroke="#e06a5c" stroke-width="1.7" d="M17.4 25.4c1.5-1.6 3.6-1.6 5.1 0"/>
      </g>
    </svg>

    <svg class="char capybara" viewBox="0 0 40 40" aria-hidden="true">
      <g>
        <ellipse cx="12.5" cy="12" rx="3" ry="2.6" fill="#a98063"/>
        <ellipse cx="27.5" cy="12" rx="3" ry="2.6" fill="#a98063"/>
        <path d="M20 9c8 0 13 5 13 11s-5 11-13 11S7 26 7 20 12 9 20 9z" fill="#c39a77"/>
        <ellipse cx="20" cy="27" rx="7" ry="4.6" fill="#a98063" opacity=".55"/>
        <path d="M31 10c2-2 5-2 6 0-1 2-4 2.6-6 1.6z" fill="#8fbf6a"/>
      </g>
      <g class="calm">
        <path class="stroke" stroke="#4a3627" stroke-width="1.8" d="M14 19.5h3.4M22.6 19.5H26"/>
        <path class="stroke" stroke="#4a3627" stroke-width="1.5" d="M18.6 27.4h2.8"/>
      </g>
      <g class="busy-face">
        <circle cx="15.6" cy="19.4" r="1.6" fill="#4a3627"/><circle cx="24.4" cy="19.4" r="1.6" fill="#4a3627"/>
        <ellipse cx="20" cy="27.4" rx="2.2" ry="1.6" fill="#4a3627"/>
        <path class="stroke" stroke="#8fd0ff" stroke-width="1.6" d="M34.5 20.5c1.4 1.8 1.4 3.4 0 4-1.4-.6-1.4-2.2 0-4z"/>
      </g>
      <g class="dead">
        <path class="stroke" stroke="#e06a5c" stroke-width="1.7" d="M14 17.8l3.2 3.2M17.2 17.8L14 21M22.8 17.8l3.2 3.2M26 17.8l-3.2 3.2"/>
        <path class="stroke" stroke="#e06a5c" stroke-width="1.5" d="M18.4 28.4c1-1 2.2-1 3.2 0"/>
      </g>
    </svg>

    <svg class="char anime" viewBox="0 0 40 40" aria-hidden="true">
      <g>
        <path d="M20 6c8.5 0 13.5 5.5 13.5 13S28 32.5 20 32.5 6.5 26.5 6.5 19 11.5 6 20 6z" fill="#f2e3d5"/>
        <path d="M20 5.5c7 0 12 3.4 13.2 8.4-2.6-2.6-6.4-1.6-8.8-3.4-1.6 3-6.6 4.2-11.2 4.6-2 .2-3.4 1-4.4 2.2C8.6 10.6 13 5.5 20 5.5z" fill="#5b4a63"/>
        <circle cx="12.6" cy="24.4" r="2.4" fill="#f0a0a8" opacity=".65"/>
        <circle cx="27.4" cy="24.4" r="2.4" fill="#f0a0a8" opacity=".65"/>
      </g>
      <g class="calm">
        <ellipse cx="14.6" cy="21" rx="2.5" ry="3.1" fill="#3a3550"/>
        <ellipse cx="25.4" cy="21" rx="2.5" ry="3.1" fill="#3a3550"/>
        <circle cx="15.5" cy="19.8" r="1" fill="#fff"/><circle cx="26.3" cy="19.8" r="1" fill="#fff"/>
        <path class="stroke" stroke="#8a6a70" stroke-width="1.4" d="M18.7 27c.9.9 1.7.9 2.6 0"/>
      </g>
      <g class="busy-face">
        <path class="stroke" stroke="#3a3550" stroke-width="2" d="M12.2 21.6c1.5-2.2 3.3-2.2 4.8 0M23 21.6c1.5-2.2 3.3-2.2 4.8 0"/>
        <ellipse cx="20" cy="27" rx="2" ry="1.7" fill="#c2707a"/>
        <path class="stroke" stroke="#8fd0ff" stroke-width="1.6" d="M34.5 19c1.4 1.8 1.4 3.4 0 4-1.4-.6-1.4-2.2 0-4z"/>
      </g>
      <g class="dead">
        <path class="stroke" stroke="#8a6a70" stroke-width="1.8" d="M12.4 19l4 4M16.4 19l-4 4M23.6 19l4 4M27.6 19l-4 4"/>
        <path class="stroke" stroke="#8a6a70" stroke-width="1.5" d="M18.4 28c1-1 2.2-1 3.2 0"/>
      </g>
    </svg>

    <div class="body">
      <div class="say" id="say"></div>
      <div class="stats">
      <div class="stat"><div class="value" id="cpu">—</div><div class="label" data-i18n="hud.cpu"></div></div>
      <div class="stat"><div class="value" id="mem">—</div><div class="label" data-i18n="hud.memory"></div></div>
      <div class="stat"><div class="value" id="threads">—</div><div class="label" data-i18n="hud.threads"></div></div>
      <div class="stat"><div class="value" id="procs">—</div><div class="label" data-i18n="hud.processes"></div></div>
      </div>
    </div>
  </div>
<script>
  const $ = id => document.getElementById(id)
  const { locale, messages } = dshHud.i18n
  const t = key => messages[key] ?? key
  document.documentElement.lang = locale
  document.title = t('hud.title')
  // The layout arrives in the query string, the same way the language does:
  // the badge is small enough that a first frame in the wrong shape would be
  // a visible flinch rather than a detail.
  const style = new URLSearchParams(location.search).get('style')
  if (['compact', 'minimal', 'assistant', 'pup', 'capybara', 'anime'].includes(style)) {
    $('card').classList.add(style)
  }
  // A character the user supplied, handed over as a path the same way the
  // language and the layout are: this page loads before any channel exists.
  // Up to three pictures the user supplied — idle, busy, down — handed over
  // the same way the language and the layout are: this page paints before any
  // channel exists.
  const query = new URLSearchParams(location.search)
  const faces = {}
  for (const key of ['idle', 'busy', 'down']) {
    const file = query.get(key)
    if (file) faces[key] = 'file://' + encodeURI(file).replace(/#/g, '%23')
  }
  const photo = $('photo')
  if (faces.idle) {
    photo.src = faces.idle
    photo.hidden = false
    // A path that no longer resolves falls back to the drawing rather than
    // leaving a broken-image glyph where a face should be.
    photo.addEventListener('error', () => { photo.hidden = true; photo.classList.remove('photo') })
  }

  /** Shows the face for a state, when one was supplied for it. */
  function showFace(kind) {
    if (!faces.idle) return
    const wanted = kind === 'stopped' ? (faces.down ?? faces.idle)
      : kind === 'work' ? (faces.busy ?? faces.idle)
        : faces.idle
    // Assigning the same src would restart an animated one on every tick.
    if (photo.src !== wanted) photo.src = wanted
  }
  $('title').textContent = t('hud.status.starting')
  $('close').title = t('hud.close')
  for (const node of document.querySelectorAll('[data-i18n]')) node.textContent = t(node.dataset.i18n)
  $('close').addEventListener('click', () => dshHud.close())

  /** A value and its unit, so the unit can be smaller than the number. */
  function put(id, value, unit) {
    const node = $(id)
    node.textContent = ''
    node.append(document.createTextNode(value))
    if (unit) {
      const suffix = document.createElement('span')
      suffix.className = 'unit'
      suffix.textContent = unit
      node.append(suffix)
    }
  }

  function bytes(value) {
    if (value >= 1024 * 1024 * 1024) return [(value / 1024 / 1024 / 1024).toFixed(1), 'GB']
    return [Math.round(value / 1024 / 1024).toString(), 'MB']
  }

  /** The status line, and the dot that colours it. */
  function showStatus(status) {
    const kind = status?.kind ?? 'stopped'
    const detail = status?.detail
    $('title').textContent = detail === undefined
      ? t('hud.status.' + kind)
      : t('hud.status.' + kind).replace('{n}', detail)
    // Working, resting, or nothing to report — three colours, not eight.
    const tone = kind === 'stopped' ? ' stop'
      : ['ready'].includes(kind) ? ''
        : ' work'
    $('dot').className = 'dot' + tone
    // The same three states drive the character's face, so it is reading the
    // badge rather than being animated on its own schedule.
    $('card').classList.toggle('work', tone === ' work')
    $('card').classList.toggle('stopped', kind === 'stopped')
    showFace(kind === 'stopped' ? 'stopped' : tone === ' work' ? 'work' : 'idle')
    $('say').textContent = $('title').textContent
  }

  dshHud.onSample(reading => {
    showStatus(reading.status)
    if (!reading.running) {
      for (const id of ['cpu', 'mem', 'threads', 'procs']) put(id, '—')
      $('cpu').classList.remove('busy')
      return
    }
    // Undefined until there are two samples to compare — the first frame
    // after opening has a memory reading but cannot have a rate yet.
    if (reading.cpu === undefined || reading.cpu === null) put('cpu', '—')
    else put('cpu', reading.cpu < 10 ? reading.cpu.toFixed(1) : Math.round(reading.cpu).toString(), '%')
    $('cpu').classList.toggle('busy', (reading.cpu ?? 0) >= 80)
    put('mem', ...bytes(reading.rssBytes))
    put('threads', String(reading.threads || '—'))
    put('procs', String(reading.processes || '—'))
  })
</script>
</body>
</html>
