<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title></title>
<style>
  html, body { height: 100%; margin: 0; background: #0a0a0d; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: 13px/1.5 -apple-system, "PingFang SC", "Segoe UI", sans-serif; color: #7a7a86;
    -webkit-user-select: none; user-select: none;
  }
  #screen {
    display: block; background: #000; cursor: pointer;
    box-shadow: 0 8px 40px rgba(0,0,0,.6); border-radius: 6px;
    max-width: 100%; max-height: 100%; object-fit: contain;
  }
  #hint { position: fixed; bottom: 10px; font-size: 11px; color: #55555f; }
  #hint.gone { display: none; }
  .flash { position: fixed; width: 26px; height: 26px; margin: -13px 0 0 -13px;
    border: 2px solid #4c8dff; border-radius: 50%; pointer-events: none;
    animation: ping .4s ease-out forwards; }
  @keyframes ping { from { transform: scale(.4); opacity: .9; } to { transform: scale(1.4); opacity: 0; } }
</style>
</head>
<body>
  <img id="screen" alt="" tabindex="0">
  <div id="hint"></div>
<script>
  const api = window.__dshMirror
  const img = document.getElementById('screen')
  const hint = document.getElementById('hint')
  hint.textContent = api?.strings?.hint ?? ''

  // The phone's own pixel size, sent with the first frame. A click on the
  // image is mapped back to these coordinates before it is sent — the image
  // is scaled to fit the window, and the phone knows nothing of that scale.
  let device = null

  api?.onFrame(({ png, viewport }) => {
    if (viewport) device = viewport
    img.src = 'data:image/png;base64,' + png
    if (hint.textContent && !hint.classList.contains('gone')) {
      // Leave the hint up for a moment, then let the picture speak.
      setTimeout(() => hint.classList.add('gone'), 4000)
    }
  })

  // Maps a window point to a device point, or null if outside the picture.
  function toDevice(clientX, clientY) {
    if (!device) return null
    const box = img.getBoundingClientRect()
    const scale = Math.min(box.width / device.width, box.height / device.height)
    const drawnW = device.width * scale, drawnH = device.height * scale
    const offX = (box.width - drawnW) / 2, offY = (box.height - drawnH) / 2
    const x = (clientX - box.left - offX) / scale
    const y = (clientY - box.top - offY) / scale
    if (x < 0 || y < 0 || x > device.width || y > device.height) return null
    return { x: Math.round(x), y: Math.round(y), scale }
  }

  // A press that moves far enough is a drag (scroll); one that does not is a
  // tap. Deciding on mouseup, from how far the pointer travelled, is what
  // lets one gesture be both without a mode.
  let press = null
  const DRAG_THRESHOLD = 8

  img.addEventListener('mousedown', event => {
    const p = toDevice(event.clientX, event.clientY)
    if (p) { press = { x: event.clientX, y: event.clientY, scale: p.scale }; img.focus() }
  })
  img.addEventListener('mouseup', event => {
    if (!press) return
    const movedY = event.clientY - press.y
    const movedX = event.clientX - press.x
    const far = Math.abs(movedY) > DRAG_THRESHOLD || Math.abs(movedX) > DRAG_THRESHOLD
    if (far) {
      // Drag: scroll the page by the device-space vertical distance, in the
      // natural direction — dragging the content up scrolls down.
      api.scroll(Math.round(-movedY / press.scale))
    } else {
      const p = toDevice(event.clientX, event.clientY)
      if (p) { flash(event.clientX, event.clientY); api.tap(p.x, p.y) }
    }
    press = null
  })

  // Keys go to whatever field the last tap focused. The mirror keeps the
  // running text and sends the whole string, because a mini program input is
  // driven by its full value, not by keystrokes — and it sends it once the
  // typing pauses, not per key. Each send is a round trip to the phone, so
  // per-key sending turns a fast sentence into a queue of laggy round trips;
  // coalescing to the latest value keeps the field in step without the pileup.
  let buffer = ''
  let flush = null
  const sendSoon = () => {
    clearTimeout(flush)
    flush = setTimeout(() => api.type(buffer), 120)
  }
  img.addEventListener('keydown', event => {
    if (event.metaKey || event.ctrlKey || event.altKey) return
    if (event.key === 'Backspace') { buffer = buffer.slice(0, -1); sendSoon(); event.preventDefault(); return }
    if (event.key === 'Enter') { clearTimeout(flush); api.type(buffer); event.preventDefault(); return }
    if (event.key.length === 1) { buffer += event.key; sendSoon(); event.preventDefault() }
  })
  // A fresh tap starts a fresh field: clear the buffer whenever focus moves.
  img.addEventListener('mousedown', () => { clearTimeout(flush); buffer = '' })

  function flash(x, y) {
    const dot = document.createElement('div')
    dot.className = 'flash'
    dot.style.left = x + 'px'; dot.style.top = y + 'px'
    document.body.appendChild(dot)
    setTimeout(() => dot.remove(), 400)
  }
</script>
</body>
</html>
